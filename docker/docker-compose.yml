services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: socializ
      POSTGRES_USER: socializ
      POSTGRES_PASSWORD: socializ
    ports:
      - '5432:5432'
    volumes:
      - socializ-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U socializ -d socializ']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      SOCIALIZ_EDITION: ${SOCIALIZ_EDITION:-CE}
      SOCIALIZ_CLOUD_PLAN: ${SOCIALIZ_CLOUD_PLAN:-starter}
      DATABASE_URL: ${DATABASE_URL:-postgres://socializ:socializ@postgres:5432/socializ}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-development-secret-change-me}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:3000}
      SOCIALIZ_LICENSE_KEY: ${SOCIALIZ_LICENSE_KEY:-}
      SOCIALIZ_LICENSE_PUBLIC_KEY: ${SOCIALIZ_LICENSE_PUBLIC_KEY:-}
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - '3000:3000'
    restart: unless-stopped

  docs:
    build:
      context: ..
      dockerfile: apps/docs/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3003
    ports:
      - '3003:3003'
    restart: unless-stopped

volumes:
  socializ-postgres-data:
